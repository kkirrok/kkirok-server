<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>${TITLE}</title>
    <link rel="stylesheet" type="text/css" href="${CONTEXT_PATH}/swagger-ui/swagger-ui.css" />
    <link rel="icon" type="image/png" href="${CONTEXT_PATH}/swagger-ui/favicon-32x32.png" sizes="32x32" />
    <style>
        html {
            box-sizing: border-box;
            overflow-y: scroll;
        }
        *, *:before, *:after {
            box-sizing: inherit;
        }
        body {
            margin: 0;
            background: #fafafa;
        }
    </style>
</head>
<body>
<div id="swagger-ui"></div>
<script src="${CONTEXT_PATH}/swagger-ui/swagger-ui-bundle.js" charset="UTF-8"></script>
<script src="${CONTEXT_PATH}/swagger-ui/swagger-ui-standalone-preset.js" charset="UTF-8"></script>
<script>
    window.onload = function() {
        const binary = atob("${API_SPEC_BASE64}");
        const bytes = Uint8Array.from(binary, function(char) {
            return char.charCodeAt(0);
        });
        const spec = JSON.parse(new TextDecoder("utf-8").decode(bytes));
        window.ui = SwaggerUIBundle({
            spec: spec,
            dom_id: "#swagger-ui",
            deepLinking: true,
            displayRequestDuration: true,
            presets: [
                SwaggerUIBundle.presets.apis,
                SwaggerUIStandalonePreset
            ],
            layout: "BaseLayout"
        });
    };
</script>
</body>
</html>
