server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  config:
    activate:
      on-profile: prod
  jackson:
    time-zone: Asia/Seoul
    property-naming-strategy: SNAKE_CASE

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${PROD_DB_URL}
    username: ${PROD_DB_USERNAME}
    password: ${PROD_DB_PASSWORD}

    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000
      idle-timeout: 30000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 100
          time_zone: Asia/Seoul
        order_inserts: true
        order_updates: true

  data:
    redis:
      host: ${PROD_REDIS_HOST:${REDISHOST:localhost}}
      port: ${PROD_REDIS_PORT:${REDISPORT:6379}}
      password: ${PROD_REDIS_PASSWORD:${REDISPASSWORD:}}

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${PROD_KAKAO_CLIENT_ID}
            client-secret: ${PROD_KAKAO_CLIENT_SECRET}
            redirect-uri: ${PROD_KAKAO_REDIRECT_URI}
            client-authentication-method: POST
            authorization-grant-type: authorization_code
            scope: profile_nickname, account_email
            client-name: Kakao
          naver:
            client-id: ${PROD_NAVER_CLIENT_ID}
            client-secret: ${PROD_NAVER_CLIENT_SECRET}
            redirect-uri: ${PROD_NAVER_REDIRECT_URI}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope: name, email, nickname
            client-name: Naver
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

firebase:
  credential-path: ${PROD_FIREBASE_CREDENTIAL_PATH:${FIREBASE_CREDENTIAL_PATH:file:/opt/kkirok/firebase-key.json}}

jwt:
  secret: ${PROD_JWT_SECRET}
  access-token-expire-time: ${PROD_ACCESS_TOKEN_EXPIRE_TIME}
  refresh-token-expire-time: ${PROD_REFRESH_TOKEN_EXPIRE_TIME}

management:
#  server:
#    port: ${PROD_ACTUATOR_PORT}
#  endpoint:
#    health:
#      show-details: always
#      enabled: true
#    info:
#      enabled: true
#    prometheus:
#      enabled: true
  endpoints:
    enabled-by-default: false
    jmx:
      exposure:
        exclude: "*"
    web:
      exposure:
        include: info, health, prometheus


logging:
  level:
    root: info
  config: classpath:log4j2-spring.xml

cors:
  allowed-origins: ${PROD_ALLOWED_ORIGINS}

app:
  server:
    url: ${PROD_SERVER_URL}

springdoc:
  api-docs:
    path: /api-specs
  use-fqn: false
  default-consumes-media-type: application/json;charset=UTF-8
  default-produces-media-type: application/json;charset=UTF-8
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    urls-primary-name: general

thread-pool:
  core-size: 2
  thread-name-prefix: executor-

cloudflare:
  r2:
    endpoint: ${PROD_R2_END_POINT}
    bucket-name: ${PROD_R2_BUCKET_NAME}
    access-key: ${PROD_R2_ACCESS_KEY}
    secret-key: ${PROD_R2_SECRET_KEY}
    public-base-url: ${PROD_R2_PUBLIC_BASE_URL:}

aws:
  ses:
    access-key: ${PROD_AWS_SES_ACCESS_KEY}
    secret-key: ${PROD_AWS_SES_SECRET_KEY}
    region: ${PROD_AWS_SES_REGION}
    source-email: ${PROD_AWS_SES_SOURCE_EMAIL}

openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com}
  model: ${OPENAI_MODEL:gpt-4.1-mini}
  fallback-model: ${OPENAI_FALLBACK_MODEL:gpt-4.1}
  connect-timeout-seconds: ${OPENAI_CONNECT_TIMEOUT_SECONDS:2}
  read-timeout-seconds: ${OPENAI_READ_TIMEOUT_SECONDS:120}
  max-retries: ${OPENAI_MAX_RETRIES:2}
  initial-backoff-millis: ${OPENAI_INITIAL_BACKOFF_MILLIS:200}
  max-output-token: ${OPENAI_MAX_OUTPUT_TOKEN:2000}

fastapi:
  base-url: ${FAST_API_BASE_URL:}
  api-key: ${FAST_API_API_KEY:}
  connect-timeout-seconds: ${FAST_API_CONNECT_TIMEOUT_SECONDS:3}
  read-timeout-seconds: ${FAST_API_READ_TIMEOUT_SECONDS:60}
  max-retries: ${FAST_API_MAX_RETRIES:1}
  initial-backoff-millis: ${FAST_API_INITIAL_BACKOFF_MILLIS:200}

webhook:
  discord:
    internal_server_url: ${WEBHOOK_INTERNAL_SERVER_URL:}
