server:
  port: 8080

spring:
  config:
    import: optional:classpath:application-secret.properties
    activate:
      on-profile: dev

  jackson:
    property-naming-strategy: SNAKE_CASE

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DEV_DB_URL}
    username: ${DEV_DB_USERNAME}
    password: ${DEV_DB_PASSWORD}

    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000
      idle-timeout: 30000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: ${DEV_REDIS_HOST}
      port: ${DEV_REDIS_PORT}
      password: ${DEV_REDIS_PASSWORD}

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${DEV_KAKAO_CLIENT_ID}
            client-secret: ${DEV_KAKAO_CLIENT_SECRET}
            redirect-uri: ${DEV_KAKAO_REDIRECT_URI}
            client-authentication-method: POST
            authorization-grant-type: authorization_code
            scope: profile_nickname, account_email
            client-name: Kakao
          naver:
            client-id: ${DEV_NAVER_CLIENT_ID}
            client-secret: ${DEV_NAVER_CLIENT_SECRET}
            redirect-uri: ${DEV_NAVER_REDIRECT_URI}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope: name, email, nickname
            client-name: Naver
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token`
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

jwt:
  secret: ${DEV_JWT_SECRET}
  access-token-expire-time: ${DEV_ACCESS_TOKEN_EXPIRE_TIME}
  refresh-token-expire-time: ${DEV_REFRESH_TOKEN_EXPIRE_TIME}

management:
#  server:
#    port: ${DEV_ACTUATOR_PORT}
#  endpoint:
#    health:
#      show-details: always
#      enabled: true
#    info:
#      enabled: true
#    prometheus:
#      enabled: true
  endpoints:
    enabled-by-default: false
    jmx:
      exposure:
        exclude: "*"
    web:
      exposure:
        include: info, health, prometheus


logging:
  level:
    root: info
  config: classpath:log4j2-spring.xml


cors:
  allowed-origins: ${DEV_ALLOWED_ORIGINS}

app:
  server:
    url: ${DEV_SERVER_URL}

springdoc:
  use-fqn: false
  default-consumes-media-type: application/json;charset=UTF-8
  default-produces-media-type: application/json;charset=UTF-8
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    urls-primary-name: general

thread-pool:
  core-size: 2
  thread-name-prefix: executor-

cloudflare:
  r2:
    endpoint: ${DEV_R2_END_POINT}
    bucket-name: ${DEV_R2_BUCKET_NAME}
    access-key: ${DEV_R2_ACCESS_KEY}
    secret-key: ${DEV_R2_SECRET_KEY}