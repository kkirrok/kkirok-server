<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kkirok 이메일 인증</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f6f8;font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#111827;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#f4f6f8;padding:24px 12px;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background-color:#ffffff;border-radius:20px;padding:40px 32px;">
                <tr>
                    <td>
                        <p style="margin:0 0 12px;font-size:14px;font-weight:700;letter-spacing:0.08em;color:#ff6b35;">KKIROK</p>
                        <h1 style="margin:0 0 16px;font-size:28px;line-height:1.3;color:#111827;">이메일 인증번호 안내</h1>
                        <p style="margin:0 0 28px;font-size:16px;line-height:1.7;color:#4b5563;">
                            아래 인증번호를 입력해 이메일 인증을 완료해주세요.
                            인증번호는 5분 동안만 유효합니다.
                        </p>
                        <div style="margin:0 0 28px;padding:20px 24px;border-radius:16px;background:linear-gradient(135deg,#fff1eb 0%,#ace0f9 100%);text-align:center;">
                            <span style="display:block;margin-bottom:8px;font-size:13px;letter-spacing:0.08em;color:#6b7280;">VERIFICATION CODE</span>
                            <strong style="font-size:36px;letter-spacing:0.24em;color:#111827;">${verificationCode}</strong>
                        </div>
                        <p style="margin:0;font-size:14px;line-height:1.7;color:#6b7280;">
                            본인이 요청하지 않았다면 이 메일을 무시하셔도 됩니다.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
