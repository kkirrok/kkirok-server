spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  data:
    redis:
      host: localhost
      port: 6379
      password:
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: test-kakao-client-id
            client-secret: test-kakao-client-secret
            redirect-uri: http://localhost:8080/login/oauth2/code/kakao
            client-authentication-method: POST
            authorization-grant-type: authorization_code
            scope: profile_nickname, account_email
            client-name: Kakao
            provider: kakao
          naver:
            client-id: test-naver-client-id
            client-secret: test-naver-client-secret
            redirect-uri: http://localhost:8080/login/oauth2/code/naver
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope: name, email, nickname
            client-name: Naver
            provider: naver
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

management:
  endpoints:
    web:
      base-path: /actuator

jwt:
  secret: test-jwt-secret-test-jwt-secret-test-jwt-secret
  access-token-expire-time: 3600000
  refresh-token-expire-time: 604800000

cors:
  allowed-origins: http://localhost:3000

app:
  server:
    url: http://localhost:8080

cloudflare:
  r2:
    access-key: test-access-key
    secret-key: test-secret-key
    endpoint: http://localhost:9000
    bucket-name: test-bucket

aws:
  ses:
    access-key: test-access-key
    secret-key: test-secret-key
    region: ap-northeast-2
    source-email: no-reply@test.com

openai:
  api-key: test-openai-api-key
  base-url: http://localhost:18080

fastapi:
  base-url: http://localhost:18081
