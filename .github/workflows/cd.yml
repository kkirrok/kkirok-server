name: CD

on:
  pull_request:
    types:
      - closed
    branches:
      - develop
      - main

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  ECR_REPOSITORY_SPRINGBOOT_DEV: ${{ secrets.ECR_REPOSITORY_SPRINGBOOT_DEV }}
  ECR_REPOSITORY_SPRINGBOOT_PROD: ${{ secrets.ECR_REPOSITORY_SPRINGBOOT_PROD }}
  COMPOSE_FILE_PATH: /home/ubuntu/docker-compose.yml
  SPRING_SERVICE_NAME: app

jobs:
  build-and-push-dev:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag
        id: meta
        run: |
          BUILD_TIME="$(date -u +'%Y%m%d-%H%M%S')"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "image_tag=dev-${BUILD_TIME}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build dev jar
        run: ./gradlew bootJar -x test

      - name: Build and push dev image
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY_SPRINGBOOT_DEV:$IMAGE_TAG" \
            --push \
            .

  deploy-dev:
    needs: build-and-push-dev
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Debug deploy target
        env:
          DEV_INSTANCE_ID: ${{ secrets.DEV_EC2_INSTANCE_ID }}
        run: |
          echo "DEV_INSTANCE_ID=$DEV_INSTANCE_ID"
          aws sts get-caller-identity
          aws ssm describe-instance-information --region "$AWS_REGION"

      - name: Deploy to dev EC2 with SSM
        env:
          DEV_INSTANCE_ID: ${{ secrets.DEV_EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ needs.build-and-push-dev.outputs.image_tag }}
        run: |
          DEPLOY_SCRIPT=$(cat <<'SCRIPT'
          set -e

          command -v aws >/dev/null 2>&1 || sudo snap install aws-cli --classic

          aws ecr get-login-password --region "__AWS_REGION__" | docker login --username AWS --password-stdin "__ECR_REGISTRY__"

          export APP_IMAGE="__ECR_REGISTRY__/__ECR_REPOSITORY__:__IMAGE_TAG__"
          export SPRING_SERVICE_NAME="__SPRING_SERVICE_NAME__"
          SERVICE_NAME="__SPRING_SERVICE_NAME__"
          COMPOSE_FILE="__COMPOSE_FILE_PATH__"
          REPOSITORY="__ECR_REGISTRY__/__ECR_REPOSITORY__"

          CURRENT_IMAGE_ID=$(docker compose -f "$COMPOSE_FILE" ps -q "$SERVICE_NAME" | xargs -r docker inspect -f '{{.Image}}' 2>/dev/null || true)

          docker images "$REPOSITORY" --format '{{.Repository}}:{{.Tag}}' | while read IMAGE_NAME; do
            IMAGE_ID=$(docker image inspect -f '{{.Id}}' "$IMAGE_NAME" 2>/dev/null || true)
            if [ -n "$IMAGE_ID" ] && [ "$IMAGE_ID" != "$CURRENT_IMAGE_ID" ]; then
              docker rmi "$IMAGE_NAME" || true
            fi
          done

          docker image prune -f

          docker compose -f "$COMPOSE_FILE" pull "$SERVICE_NAME"
          docker compose -f "$COMPOSE_FILE" up -d --no-deps "$SERVICE_NAME"

          NEW_IMAGE_ID=$(docker inspect -f '{{.Image}}' "$SERVICE_NAME" 2>/dev/null || true)

          docker images "$REPOSITORY" --format '{{.Repository}}:{{.Tag}}' | while read IMAGE_NAME; do
            IMAGE_ID=$(docker image inspect -f '{{.Id}}' "$IMAGE_NAME" 2>/dev/null || true)
            if [ -n "$IMAGE_ID" ] && [ "$IMAGE_ID" != "$NEW_IMAGE_ID" ]; then
              docker rmi "$IMAGE_NAME" || true
            fi
          done

          docker image prune -f
          SCRIPT
          )

          DEPLOY_SCRIPT="${DEPLOY_SCRIPT//__AWS_REGION__/$AWS_REGION}"
          DEPLOY_SCRIPT="${DEPLOY_SCRIPT//__ECR_REGISTRY__/$ECR_REGISTRY}"
          DEPLOY_SCRIPT="${DEPLOY_SCRIPT//__ECR_REPOSITORY__/$ECR_REPOSITORY_SPRINGBOOT_DEV}"
          DEPLOY_SCRIPT="${DEPLOY_SCRIPT//__IMAGE_TAG__/$IMAGE_TAG}"
          DEPLOY_SCRIPT="${DEPLOY_SCRIPT//__SPRING_SERVICE_NAME__/$SPRING_SERVICE_NAME}"
          DEPLOY_SCRIPT="${DEPLOY_SCRIPT//__COMPOSE_FILE_PATH__/$COMPOSE_FILE_PATH}"

          PARAMETERS=$(jq -n --arg command "$DEPLOY_SCRIPT" '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$DEV_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy dev spring container" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          while true; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$DEV_INSTANCE_ID" \
              --query "Status" \
              --output text)

            if [ "$STATUS" = "Pending" ] || [ "$STATUS" = "InProgress" ] || [ "$STATUS" = "Delayed" ]; then
              sleep 3
            else
              break
            fi
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$DEV_INSTANCE_ID" \
            --query "{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}" \
            --output json

          if [ "$STATUS" != "Success" ]; then
            echo "SSM deployment failed with status: $STATUS"
            exit 1
          fi

  build-and-push-prod:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'develop'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag
        id: meta
        run: |
          BUILD_TIME="$(date -u +'%Y%m%d-%H%M%S')"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "image_tag=prod-${BUILD_TIME}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build prod jar
        run: ./gradlew bootJar -x test

      - name: Build and push prod image
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY_SPRINGBOOT_PROD:$IMAGE_TAG" \
            --push \
            .

  deploy-prod:
    needs: build-and-push-prod
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'develop'
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Debug deploy target
        env:
          PROD_INSTANCE_ID: ${{ secrets.PROD_PRIVATE_EC2_INSTANCE_ID }}
        run: |
          echo "PROD_INSTANCE_ID=$PROD_INSTANCE_ID"
          aws sts get-caller-identity
          aws ssm describe-instance-information --region "$AWS_REGION"

      - name: Deploy to prod private EC2 with SSM
        env:
          PROD_INSTANCE_ID: ${{ secrets.PROD_PRIVATE_EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ needs.build-and-push-prod.outputs.image_tag }}
        run: |
          DEPLOY_SCRIPT=$(cat <<'SCRIPT'
          set -e

          command -v aws >/dev/null 2>&1 || sudo snap install aws-cli --classic

          aws ecr get-login-password --region "__AWS_REGION__" | docker login --username AWS --password-stdin "__ECR_REGISTRY__"

          export APP_IMAGE="__ECR_REGISTRY__/__ECR_REPOSITORY__:__IMAGE_TAG__"
          export SPRING_SERVICE_NAME="__SPRING_SERVICE_NAME__"
          SERVICE_NAME="__SPRING_SERVICE_NAME__"
          COMPOSE_FILE="__COMPOSE_FILE_PATH__"
          REPOSITORY="__ECR_REGISTRY__/__ECR_REPOSITORY__"

          CURRENT_IMAGE_ID=$(docker compose -f "$COMPOSE_FILE" ps -q "$SERVICE_NAME" | xargs -r docker inspect -f '{{.Image}}' 2>/dev/null || true)

          docker images "$REPOSITORY" --format '{{.Repository}}:{{.Tag}}' | while read IMAGE_NAME; do
            IMAGE_ID=$(docker image inspect -f '{{.Id}}' "$IMAGE_NAME" 2>/dev/null || true)
            if [ -n "$IMAGE_ID" ] && [ "$IMAGE_ID" != "$CURRENT_IMAGE_ID" ]; then
              docker rmi "$IMAGE_NAME" || true
            fi
          done

          docker image prune -f

          docker compose -f "$COMPOSE_FILE" pull "$SERVICE_NAME"
          docker compose -f "$COMPOSE_FILE" up -d --no-deps "$SERVICE_NAME"

          NEW_IMAGE_ID=$(docker inspect -f '{{.Image}}' "$SERVICE_NAME" 2>/dev/null || true)

          docker images "$REPOSITORY" --format '{{.Repository}}:{{.Tag}}' | while read IMAGE_NAME; do
            IMAGE_ID=$(docker image inspect -f '{{.Id}}' "$IMAGE_NAME" 2>/dev/null || true)
            if [ -n "$IMAGE_ID" ] && [ "$IMAGE_ID" != "$NEW_IMAGE_ID" ]; then
              docker rmi "$IMAGE_NAME" || true
            fi
          done

          docker image prune -f
          SCRIPT
          )

          DEPLOY_SCRIPT="${DEPLOY_SCRIPT//__AWS_REGION__/$AWS_REGION}"
          DEPLOY_SCRIPT="${DEPLOY_SCRIPT//__ECR_REGISTRY__/$ECR_REGISTRY}"
          DEPLOY_SCRIPT="${DEPLOY_SCRIPT//__ECR_REPOSITORY__/$ECR_REPOSITORY_SPRINGBOOT_PROD}"
          DEPLOY_SCRIPT="${DEPLOY_SCRIPT//__IMAGE_TAG__/$IMAGE_TAG}"
          DEPLOY_SCRIPT="${DEPLOY_SCRIPT//__SPRING_SERVICE_NAME__/$SPRING_SERVICE_NAME}"
          DEPLOY_SCRIPT="${DEPLOY_SCRIPT//__COMPOSE_FILE_PATH__/$COMPOSE_FILE_PATH}"

          PARAMETERS=$(jq -n --arg command "$DEPLOY_SCRIPT" '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$PROD_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy prod spring container" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          while true; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$PROD_INSTANCE_ID" \
              --query "Status" \
              --output text)

            if [ "$STATUS" = "Pending" ] || [ "$STATUS" = "InProgress" ] || [ "$STATUS" = "Delayed" ]; then
              sleep 3
            else
              break
            fi
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$PROD_INSTANCE_ID" \
            --query "{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}" \
            --output json

          if [ "$STATUS" != "Success" ]; then
            echo "SSM deployment failed with status: $STATUS"
            exit 1
          fi
